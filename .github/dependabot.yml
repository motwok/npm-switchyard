version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    labels: [dependencies]
    commit-message:
      prefix: "chore(ci)"
