name: Release Drafter

on:
  # On master the notes are written by the release job in build.yml, only when there is a release.
  # pull_request_target: fork PRs get a read-only token on pull_request; no PR code is checked out
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  autolabel:
    if: github.event_name == 'pull_request_target'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter/autolabeler@v7
        with:
          config-name: release-drafter.yml
