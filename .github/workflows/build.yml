name: Build

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          [ -z "$out" ] || { echo "$out"; exit 1; }
      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      - name: Test
        run: |
          mkdir -p "$PWD/cover-unit"
          pkgs=$(go list ./... | grep -v /dockertest | paste -sd, -)  # test helpers are not product code
          go test -race -covermode=atomic -coverpkg="$pkgs" -cover ./... -args -test.gocoverdir="$PWD/cover-unit"
      - uses: actions/upload-artifact@v7
        with:
          name: cover-unit
          path: cover-unit
      - name: Cross build
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/switchyard
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/switchyard
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/switchyard

  integration:
    name: Integration (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Build test image
        run: docker build --build-arg COVER=1 -t switchyard:test .
      - name: Integration test
        run: IMAGE=switchyard:test COVERDIR="$PWD/cover-integration" sh tests/integration/run.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cover-integration-${{ matrix.arch }}
          path: cover-integration
          if-no-files-found: ignore

  npm:
    name: NPM integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build test image
        run: docker build --build-arg COVER=1 -t switchyard:test .
      - name: NPM integration test
        run: IMAGE=switchyard:test COVERDIR="$PWD/cover-npm" sh tests/npm/run.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cover-npm
          path: cover-npm
          if-no-files-found: ignore

  coverage:
    name: Coverage
    needs: [unit, integration, npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          pattern: cover-*
          path: cover
      - name: Report
        run: |
          dirs=$(find cover -mindepth 1 -maxdepth 1 -type d | paste -sd, -)
          go tool covdata textfmt -i="$dirs" -o cover.txt
          go tool cover -html=cover.txt -o coverage.html
          {
            echo "## Coverage (unit + integration)"
            echo '```'
            go tool covdata percent -i="$dirs"
            go tool cover -func=cover.txt | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=cover.txt | tail -1
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            cover.txt
            coverage.html

  windows:
    name: Windows (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            os: ltsc2022
          - runner: windows-2025
            os: ltsc2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Docker engine
        shell: pwsh
        run: |
          Get-Service docker -ErrorAction SilentlyContinue | Format-List Name,Status,StartType
          Get-WindowsFeature Containers -ErrorAction SilentlyContinue | Format-List Name,InstallState
          if (Get-Service docker -ErrorAction SilentlyContinue) { Start-Service docker }
          docker version
      - name: Build
        shell: bash
        run: CGO_ENABLED=0 go build -o switchyard.exe ./cmd/switchyard
      - name: Image
        run: docker build -f Dockerfile.windows --build-arg OSVERSION=${{ matrix.os }} -t switchyard:test .
      - name: Smoke test (pipe access, /metrics)
        shell: bash
        run: |
          docker run -d --name sy --isolation process \
            --mount 'type=npipe,src=\\.\pipe\docker_engine,dst=\\.\pipe\docker_engine' \
            -e SWITCHYARD_CONFIG='{log_level: debug, private_key: "LLS0gQNA3cdq5h3gg1g/pqIrqUdEdkGu7dJIDQehz10="}' switchyard:test
          for i in $(seq 1 30); do
            if docker exec sy 'C:\switchyard.exe' health; then docker logs sy; exit 0; fi
            sleep 2
          done
          docker logs sy
          exit 1

  release:
    name: Release
    if: github.event_name != 'pull_request'
    needs: [unit, integration, npm, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Image changed since last release?
        id: changed
        run: |
          last=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then echo "release=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -z "$last" ] || ! git diff --quiet "$last" HEAD -- '*.go' go.mod go.sum Dockerfile Dockerfile.windows; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No image-relevant change since $last, no release." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish release
        id: drafter
        if: steps.changed.outputs.release == 'true'
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
          publish: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v7
        if: steps.changed.outputs.release == 'true'
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@v4
        if: steps.changed.outputs.release == 'true'
      - uses: docker/login-action@v4
        if: steps.changed.outputs.release == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Linux images
        if: steps.changed.outputs.release == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: VERSION=${{ steps.drafter.outputs.resolved_version }}
          tags: ghcr.io/motwok/npm-switchyard:${{ steps.drafter.outputs.resolved_version }}-linux
      - name: Windows images and manifest list
        if: steps.changed.outputs.release == 'true'
        env:
          V: ${{ steps.drafter.outputs.resolved_version }}
          IMG: ghcr.io/motwok/npm-switchyard
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$V" \
            -o switchyard.exe ./cmd/switchyard
          for os in 1809 ltsc2022 ltsc2025; do
            docker buildx build --platform windows/amd64 -f Dockerfile.windows --build-arg OSVERSION=$os \
              --provenance=false --sbom=false --push -t "$IMG:$V-windows-$os" .
          done
          # The index is written through the registry API: Docker on Windows picks the variant
          # by os.version, which buildx and imagetools do not set.
          api=https://ghcr.io/v2/motwok/npm-switchyard
          tok=$(curl -fsS -u "${{ github.actor }}:$GH_TOKEN" \
            "https://ghcr.io/token?scope=repository:motwok/npm-switchyard:pull,push" | jq -r .token)
          get() { curl -fsSL -H "Authorization: Bearer $tok" -H "Accept: $2" "$api/$1"; }
          IDX=application/vnd.oci.image.index.v1+json
          MAN=application/vnd.oci.image.manifest.v1+json
          entries=$(get "manifests/$V-linux" "$IDX" | jq -c '[.manifests[] | select(.platform.os=="linux")]')
          for os in 1809 ltsc2022 ltsc2025; do
            get "manifests/$V-windows-$os" "$MAN" > m.json  # exact bytes for digest and size
            digest="sha256:$(sha256sum < m.json | cut -d' ' -f1)"
            size=$(wc -c < m.json)
            cfg=$(jq -r .config.digest m.json)
            osv=$(get "blobs/$cfg" '*/*' | jq -r '."os.version"')
            [ -n "$osv" ] && [ "$osv" != null ] || { echo "no os.version for $os"; exit 1; }
            entries=$(echo "$entries" | jq -c --arg d "$digest" --argjson s "$size" --arg v "$osv" --arg mt "$MAN" \
              '. + [{mediaType: $mt, digest: $d, size: $s,
                     platform: {architecture: "amd64", os: "windows", "os.version": $v}}]')
          done
          index=$(jq -nc --arg mt "$IDX" --argjson m "$entries" '{schemaVersion: 2, mediaType: $mt, manifests: $m}')
          echo "$index" | jq .
          for tag in "$V" latest; do
            printf %s "$index" | curl -fsS -X PUT -H "Authorization: Bearer $tok" -H "Content-Type: $IDX" \
              --data-binary @- "$api/manifests/$tag"
          done
