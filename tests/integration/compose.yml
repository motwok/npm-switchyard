# Two agents on one Docker host: "a" imports, "b" exports (TST-2).
name: sy-it

networks:
  imp:
    ipam:
      config:
        - subnet: 172.28.0.0/24
          ip_range: 172.28.0.128/25
  link: {}
  tgt: {}
  loc: {}

services:
  b:
    image: ${IMAGE}
    environment:
      GOCOVERDIR: /cover
      SWITCHYARD_CONFIG: |
        log_level: debug
        private_key: "LLS0gQNA3cdq5h3gg1g/pqIrqUdEdkGu7dJIDQehz10="
        partners:
          - name: a
            public_key: "RINyVq7yQFyJwxKem6pabaa/HaYF2tYO1KSiaZJS5b0="
    volumes:
      - ${COVERDIR:?set COVERDIR}:/cover
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [link, tgt]

  a:
    image: ${IMAGE}
    cap_add: [NET_ADMIN]
    environment:
      GOCOVERDIR: /cover
      SWITCHYARD_CONFIG: |
        log_level: debug
        import_network: sy-it_imp
        private_key: "9Ktfb/WqyMKethZfu/jDpSVsAgFgwA7LGmggx6scHrk="
        partners:
          - name: b
            address: b:9481
            public_key: "XRX+eTqjLBXPs4Sob4ad2h6/ltChA+LOshAdgGTPbIg="
    volumes:
      - ${COVERDIR:?set COVERDIR}:/cover
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      imp:
        ipv4_address: 172.28.0.2
      link: {}
      loc: {}

  web:
    image: traefik/whoami:v1.11
    networks: [tgt]

  localweb:
    image: traefik/whoami:v1.11
    networks: [loc]

  udpecho:
    image: alpine:3.22
    command: ["sh", "-c", "apk add -q socat && socat UDP4-RECVFROM:9999,fork EXEC:cat"]
    networks: [tgt]

  client:
    image: alpine:3.22
    command: ["sleep", "infinity"]
    dns: [172.28.0.2]
    networks: [imp, link] # link: reads b's metrics
    depends_on:
      a:
        condition: service_healthy
